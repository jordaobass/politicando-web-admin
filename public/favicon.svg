<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Admin usa o AZUL da bandeira como fundo (o site público usa o verde) -->
    <linearGradient id="fundoAdmin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2a6b" />
      <stop offset="1" stop-color="#163a8f" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#fundoAdmin)" />

  <!-- "P" da marca Politicando: branco com contorno amarelo -->
  <path
    d="M16 14 H36 A13 13 0 0 1 36 40 H26 V52 H16 Z
       M43 27 A6 6 0 1 0 31 27 A6 6 0 1 0 43 27 Z"
    fill="#ffffff"
    fill-rule="evenodd"
    stroke="#f7c518"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Badge de engrenagem = sinal de painel/administração -->
  <g transform="translate(48,48)">
    <circle r="12" fill="#f7c518" stroke="#0b2a6b" stroke-width="1.5" />
    <g fill="#0b2a6b">
      <rect x="-1.6" y="-9.5" width="3.2" height="4.5" rx="1" transform="rotate(0)" />
      <rect x="-1.6" y="-9.5" width="3.2" height="4.5" rx="1" transform="rotate(45)" />
      <rect x="-1.6" y="-9.5" width="3.2" height="4.5" rx="1" transform="rotate(90)" />
      <rect x="-1.6" y="-9.5" width="3.2" height="4.5" rx="1" transform="rotate(135)" />
      <rect x="-1.6" y="-9.5" width="3.2" height="4.5" rx="1" transform="rotate(180)" />
      <rect x="-1.6" y="-9.5" width="3.2" height="4.5" rx="1" transform="rotate(225)" />
      <rect x="-1.6" y="-9.5" width="3.2" height="4.5" rx="1" transform="rotate(270)" />
      <rect x="-1.6" y="-9.5" width="3.2" height="4.5" rx="1" transform="rotate(315)" />
    </g>
    <circle r="5.6" fill="#0b2a6b" />
    <circle r="2.4" fill="#f7c518" />
  </g>
</svg>
