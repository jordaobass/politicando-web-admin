# Serve os arquivos estáticos do build (SPA) e faz proxy de /api/ para o backend
# na rede interna do compose. Assim a API NÃO passa pelo proxy da Cloudflare
# (o admin chama same-origin /api) — mesmo padrão do rewrite do frontend Next.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy da API para o backend interno (resolver do Docker em 127.0.0.11).
    # Usa variável + $request_uri para não resolver no boot (sobrevive ao backend
    # ainda não estar pronto) e preservar o prefixo /api.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api_upstream http://backend:8080;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Assets com hash no nome -> cache longo e imutável.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Client-side routing (React Router): tudo cai no index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
